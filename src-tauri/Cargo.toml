[package]
name = "flowdir"
version = "0.6.15"
description = "FlowDir file manager"
edition = "2021"
rust-version = "1.93"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
zip = "9"
tar = { version = "0.4", default-features = false }
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = "0.24"
ruzstd = "0.9"
zstd = "0.14"
sevenz-rust2 = "0.24"
cab = "0.6"
unrar-rs = { version = "0.14", default-features = false, features = ["crypto-rust"] }
isomage = { version = "2.1", default-features = false }
jwalk = "0.9"
log = "0.4"
webview2-com = "0.39"
everything-ipc = "0.1"
windows-core = "0.62"
windows-future = "0.3"
percent-encoding = "2"
regex = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_System_LibraryLoader",
  "Win32_Globalization",
  "Win32_Media_MediaFoundation",
  "Win32_System_Variant",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Data_Pdf",
] }
toml_edit = { version = "0.25.5", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
